schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

rules:
  tasks:
    - Følg kontrolniveauerne i AGENTS.md. Brug én afsluttende kontrolopgave med `npm run verify:full` før lokal brugertest; tilføj ikke separate kør-alle-tests-opgaver pr. sektion.
    - Tilføj kun nye tests for adfærd, ændringen indfører eller retter, primært i eksisterende testfiler. Browserprøver dækker kerneforløbet; gentag ikke samme forløb i flere bredder uden layoutgrund.
    - Visuel kontrol (skærmbilleder, axe-rapport) kun ved større UI-ændringer og højst ved 390 og 1440 px.
    - Opgaver må ikke kræve testantal, kørselsstatus eller kontroldatoer skrevet i docs eller tasks.md.
  design:
    - Beskriv verifikation kort og proportionalt. Henvis til kontrolniveauerne i AGENTS.md frem for at opremse alle kontroller.
